name: Build Gatinho Companheiro

on:
  push:
    branches: [ "principal" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o repositorio
        uses: actions/checkout@v4

      - name: Extrair projeto
        run: |
          rm -rf project
          mkdir project
          unzip -q GatinhoCompanheiro-v1.3-corrigido.zip -d project
          test -f project/settings.gradle.kts

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10.2'

      - name: Compilar APK
        working-directory: project
        run: gradle assembleDebug --stacktrace

      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: gatinho-companheiro-apk
          path: project/app/build/outputs/apk/debug/app-debug.apk
